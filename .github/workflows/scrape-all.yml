name: Consulta JPL — Batch (todos los RUT)

# One-click, no input: scrapes every active RUT of every juzgado listed in the
# Sheet's "RutsConsulta" tab, causas from 2020 onward. Data → Sheet, PDFs → Drive.
# Just press "Run workflow".
#
# The site is unstable and a run is capped at 55 min, so each run scrapes what it
# can and then re-dispatches ITSELF to continue — part of the run YOU started, not
# a scheduled/background job. It stops on its own once every active RUT is done
# (or after MAX_RESUME_ATTEMPTS). There is NO cron trigger. The fields below are
# internal (self-resume) — leave them blank.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Uso interno — dejar vacío"
        required: false
        default: ""
      resume_attempt:
        description: "Uso interno — no modificar"
        required: false
        default: "0"

env:
  MAX_RESUME_ATTEMPTS: "50"
  MAX_RUNTIME_SECONDS: "3000"
  FROM_YEAR: "2020"

jobs:
  scrape-all:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: felipe/scraper/requirements.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('felipe/scraper/requirements.txt') }}

      - name: Resolve job ID
        id: job
        run: |
          provided="${{ github.event.inputs.job_id }}"
          if [ -z "$provided" ]; then
            echo "id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "New batch: ${{ github.run_id }}"
          else
            echo "id=$provided" >> "$GITHUB_OUTPUT"
            echo "Resuming batch: $provided"
          fi

      - name: Install dependencies
        run: pip install -r felipe/scraper/requirements.txt

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            fonts-freefont-ttf fonts-liberation libfontconfig1 xvfb 2>/dev/null || true

      - name: Restore config (Sheet/folder IDs)
        env:
          JPL_CONFIG: ${{ secrets.JPL_CONFIG }}
        run: |
          if [ -n "$JPL_CONFIG" ]; then
            printf '%s' "$JPL_CONFIG" > felipe/scraper/jpl_config.json
            echo "jpl_config.json restored ($(wc -c < felipe/scraper/jpl_config.json) bytes)"
          else
            echo "::error::JPL_CONFIG secret is not set. Run 'python run.py --setup' locally, then paste felipe/scraper/jpl_config.json into a repo secret named JPL_CONFIG."
            exit 1
          fi

      - name: Check resume cap
        id: cap
        run: |
          attempt="${{ github.event.inputs.resume_attempt }}"
          if [ "$attempt" -ge "$MAX_RESUME_ATTEMPTS" ]; then
            echo "Límite de reintentos alcanzado ($attempt / $MAX_RESUME_ATTEMPTS). Deteniendo."
            echo "capped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run batch scraper
        if: ${{ steps.cap.outputs.capped != 'true' }}
        continue-on-error: true
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_JSON:    ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          cd felipe/scraper && python run.py --all \
            --max-seconds "$MAX_RUNTIME_SECONDS" \
            --from-year "$FROM_YEAR"

      - name: Re-dispatch if not complete
        if: ${{ !cancelled() && steps.cap.outputs.capped != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          status=$(cat /tmp/scrape_status 2>/dev/null || echo "unknown")
          echo "Estado del scraper: $status"
          if [ "$status" = "incomplete" ] || [ "$status" = "crashed" ]; then
            next_attempt=$(( ${{ github.event.inputs.resume_attempt }} + 1 ))
            echo "Re-despachando como intento $next_attempt (estado=$status)..."
            gh workflow run scrape-all.yml \
              --repo "${{ github.repository }}" \
              --field job_id="${{ steps.job.outputs.id }}" \
              --field resume_attempt="$next_attempt"
          else
            echo "Batch $status — sin re-despacho."
          fi
