name: Limpiar Sheet

# Clears all data rows from the JPL Google Sheet (keeps the header row of each
# tab). Dispatched from the web page's "wipe" button.

on:
  workflow_dispatch: {}

jobs:
  wipe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # playwright (package only, no browser) because run.py imports it at module load.
        run: pip install google-auth google-auth-oauthlib google-api-python-client playwright

      - name: Clear the Sheet
        working-directory: ${{ github.workspace }}/felipe/scraper
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_JSON:    ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python run.py --wipe
