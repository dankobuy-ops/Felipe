name: Exportar a Sheets

# Export runs in CI (not the local watcher) so it can be triggered from any
# device — including the phone — via the SPA. It needs no browser, just the
# service key (to write the Supabase relational tables) and the Sheet webhook.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID to export (blank = all jobs)"
        required: false
        default: ""

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Export to Supabase + Sheet
        working-directory: ${{ github.workspace }}/felipe
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Public (already in the SPA), so kept inline rather than as secrets:
          SHEETS_WEBHOOK_URL: "https://script.google.com/macros/s/AKfycbzjJK-QoDiyDygjaDy6Dt7dk8a8c5WD_gnV1u1fixug2VqbIUcg1nEGMycNmkmApJCy/exec"
          SHEETS_ID: "1qWNiprgWcYOC4MPQ8VeqOqZebn4GXxdRzhNADNQFGKY"
        run: |
          python scraper/export_sheets.py \
            ${{ github.event.inputs.job_id != '' && format('--job-id "{0}"', github.event.inputs.job_id) || '--all' }}
