name: Consulta JPL

on:
  workflow_dispatch:
    inputs:
      search_code:
        description: "RUT a consultar (ej: 12345678-9)"
        required: true
      target_url:
        description: "URL del juzgado municipal (página con botón CONSULTA DE CAUSAS)"
        required: true
      job_id:
        description: "ID del trabajo (dejar vacío para nueva consulta — se auto-genera)"
        required: false
        default: ""
      resume_attempt:
        description: "Uso interno — no modificar"
        required: false
        default: "0"
      year:
        description: "Filtrar por año (ej: 2025). Vacío = todos los años."
        required: false
        default: ""
      juzgado:
        description: "Juzgado a consultar (vitacura / lobarnechea)"
        required: false
        default: "vitacura"

env:
  MAX_RESUME_ATTEMPTS: "50"
  MAX_RUNTIME_SECONDS: "3000"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: felipe/scraper/requirements.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('felipe/scraper/requirements.txt') }}

      - name: Resolve job ID
        id: job
        run: |
          provided="${{ github.event.inputs.job_id }}"
          if [ -z "$provided" ]; then
            # New job — use run ID as stable identifier
            echo "id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "New job: ${{ github.run_id }}"
          else
            echo "id=$provided" >> "$GITHUB_OUTPUT"
            echo "Resuming job: $provided"
          fi

      - name: Install dependencies
        run: pip install -r felipe/scraper/requirements.txt

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Validate URL
        run: python felipe/scraper/validate_inputs.py "${{ github.event.inputs.target_url }}"

      - name: Check resume cap
        id: cap
        run: |
          attempt="${{ github.event.inputs.resume_attempt }}"
          if [ "$attempt" -ge "$MAX_RESUME_ATTEMPTS" ]; then
            echo "Límite de reintentos alcanzado ($attempt / $MAX_RESUME_ATTEMPTS). Marcando trabajo como detenido."
            cd felipe/scraper && python mark_stalled.py \
              --job-id "${{ steps.job.outputs.id }}" \
              --supabase-url "${{ secrets.SUPABASE_URL }}" \
              --supabase-key "${{ secrets.SUPABASE_SERVICE_KEY }}"
            # exit 0 only ends THIS step — flag the cap so later steps skip,
            # otherwise the scraper runs and re-dispatches forever.
            echo "capped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scraper
        if: ${{ steps.cap.outputs.capped != 'true' }}
        continue-on-error: true
        env:
          JOB_ID: ${{ steps.job.outputs.id }}
          SEARCH_CODE: ${{ github.event.inputs.search_code }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          JUZGADO: ${{ github.event.inputs.juzgado }}
        run: |
          cd felipe/scraper && python run.py \
            --job-id "$JOB_ID" \
            --search-code "$SEARCH_CODE" \
            --target-url "$TARGET_URL" \
            --max-seconds "$MAX_RUNTIME_SECONDS" \
            --year "${{ github.event.inputs.year }}" \
            --juzgado "$JUZGADO"

      - name: Re-dispatch if not complete
        if: ${{ !cancelled() && steps.cap.outputs.capped != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          status=$(cat /tmp/scrape_status 2>/dev/null || echo "unknown")
          echo "Scraper status: $status"
          if [ "$status" = "incomplete" ] || [ "$status" = "crashed" ]; then
            next_attempt=$(( ${{ github.event.inputs.resume_attempt }} + 1 ))
            echo "Re-despachando como intento $next_attempt (estado=$status)..."
            gh workflow run scrape.yml \
              --repo "${{ github.repository }}" \
              --field job_id="${{ steps.job.outputs.id }}" \
              --field search_code="${{ github.event.inputs.search_code }}" \
              --field target_url="${{ github.event.inputs.target_url }}" \
              --field resume_attempt="$next_attempt" \
              --field year="${{ github.event.inputs.year }}" \
              --field juzgado="${{ github.event.inputs.juzgado }}"
          else
            echo "Trabajo $status — sin re-despacho."
          fi
