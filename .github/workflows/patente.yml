name: Buscar Patentes

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID cuyas patentes enriquecer"
        required: true
      dry_run:
        description: "Dry run — imprimir sin guardar"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  patentes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: felipe/scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r felipe/scraper/requirements.txt

      - name: Buscar patentes
        working-directory: ${{ github.workspace }}/felipe
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scraper/enrich_patentes.py \
            --job-id "${{ github.event.inputs.job_id }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
