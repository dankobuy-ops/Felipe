name: PJUD — censo remoto (por demanda)

# Sharded national census across N runners, on demand. Each shard takes a disjoint slice of the
# ~230 civil tribunales, sweeps it, and writes what it finds straight to Neon.
#
# ON DEMAND ONLY, deliberately. The previous PJUD workflow carried a cron and spent ~13 days
# firing 17 failing jobs a day at the OJV. If this is ever wanted on a schedule, that is a
# decision to take explicitly, after it has proven itself by hand.
#
# ⚠️ HEADED UNDER XVFB, NEVER HEADLESS. Measured 2026-08-11, same code both ways:
#     headed under Xvfb   entered, 232 tribunales, search returned results
#     --headless=new      entry failed after 102 s, form never appeared
# F5's challenge script tests document.visibilityState, and a headless browser has no visible
# surface, so the challenge never completes. That single flag is the entire reason the old
# workflow failed every day for a fortnight. `headless_check.py` re-verifies it in one command.
#
# ⚠️ SHARDS SHARE ONE BUDGET — it belongs to the datacenter RANGE, not to an address. Measured
# 2026-08-11: three shards on 128.24.160.226, 132.196.32.71 and 48.217.108.208 all took their
# first block within fourteen seconds of each other while the residential workers sweeping that
# same minute were untouched, and the three together produced 214 causa opens against 226 for one
# shard alone. Whatever else is true, extra runners do NOT buy extra allowance.
#
# ⚠️★ SETTLED 2026-08-12 — IT IS THE CONCURRENT SESSIONS, NOT THE RATE. USE shards=1.
# The earlier trial confounded the two (every shard ran at the single-worker 20 s gap, ~9 result
# requests/min), so it was re-run properly: four runners joining 30 min apart, each paced x4 so
# the AGGREGATE never exceeded one worker's rate. Every one entered on its first attempt —
# datacenter addresses are not refused at the door — and then:
#     20:23 s1 joins .. 20:53 s2 .. 21:23 s3   -> 3 concurrent
#     21:34:36 s2 blocked / 21:34:50 s3 blocked   FOURTEEN seconds apart
#     21:53 s4 joins                            -> 2 concurrent
#     23:39:22 s1 blocked / 23:39:40 s4 blocked   EIGHTEEN seconds apart
# Unrelated addresses cut down in near-simultaneous pairs with rate held constant. And the
# throughput is WORSE than one worker, because each shard pays the x N pacing tax and is culled
# anyway: 4 shards produced 130 causa opens in 196 min, against ~218 for one shard extrapolated
# from its measured 1.11 opens/min. Same shape as the 214-vs-226 of 2026-08-11.
# ⇒ Remote means ONE worker, chained with a cool-off. The parallelism that works is LOCAL.
# `shards` and `ramp_min` are kept because they are how the experiment was run and how it would
# be re-run if the site changes — not because more runners help. Two runners did survive 1h46m
# against 11 minutes for three, so if you ever want two, expect to be culled in pairs.
#
# A census alone is ~3.3 h for 230 tribunales on one worker; WITH detail (open every bank causa
# and fetch its ebook) it is far longer — locally that runs at roughly one causa a minute. So a
# detail pass is not expected to finish in one dispatch, and does not need to: state is carried
# forward in an artifact keyed to the date window, and re-dispatching resumes where the last run
# stopped. Completed tribunales are skipped instantly and causas already banked are never
# re-opened, so the second dispatch spends its budget only on what is actually left.

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Desde (dd/mm/aaaa)"
        required: true
        default: "01/07/2026"
      hasta:
        description: "Hasta (dd/mm/aaaa)"
        required: true
        default: "14/07/2026"
      shards:
        description: "Cuántos runners en paralelo (1 = un solo worker de punta a punta)"
        required: false
        default: "1"
      ramp_min:
        description: "Minutos entre la entrada de un runner y el siguiente (0 = todos juntos)"
        required: false
        default: "30"
      base_search_gap:
        description: "Segundos entre requests de resultados, POR RUNNER antes de escalar"
        required: false
        default: "20"
      base_causa_gap:
        description: "Segundos entre aperturas de causa, POR RUNNER antes de escalar"
        required: false
        default: "25"
      detail:
        description: "false = solo censo | true = además abre cada causa y baja el ebook"
        required: false
        default: "true"
      only_proc:
        description: "Regex de procedimiento a conservar (vacío = todos)"
        required: false
        default: "obligaci.*dar"
      resume:
        description: "true = continuar el state de la corrida anterior de esta MISMA ventana"
        required: false
        default: "true"
      chain:
        description: "Cuántas veces puede relanzarse sola al bloquearse (0 = ninguna)"
        required: false
        default: "0"
      cooloff_min:
        description: "Minutos de espera antes de relanzarse (la IP nueva vive en el mismo rango)"
        required: false
        default: "100"

# ⚠️ ONE RUN AT A TIME, ALWAYS. Without this a chained run could overlap the one that spawned it,
# or a hand dispatch could start a second chain beside the first — and every extra run is another
# set of live browsers hitting the site outside the arrival protocol. cancel-in-progress is FALSE
# on purpose: a queued run waits its turn, it does not kill a sweep that is working.
concurrency:
  group: pjud-censo
  cancel-in-progress: false

permissions:
  contents: read
  actions: read            # required to pull the previous run's state artifact

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math, os
          n = max(1, min(12, int("${{ inputs.shards }}" or 6)))
          total = 230
          step = math.ceil(total / n)
          shards = [{"slot": i + 1, "start": i * step,
                     "end": min(total - 1, (i + 1) * step - 1)}
                    for i in range(n) if i * step <= total - 1]
          print("matrix=" + json.dumps({"include": shards}))
          PY

  censo:
    needs: plan
    runs-on: ubuntu-latest
    # ⚠️ 55 was NEVER GitHub's limit — a hosted job may run for 6 hours. That number came from
    # sizing six parallel shards and was then inherited by single-shard runs, which simply died
    # at 55 min with the country half-swept: runs 31450801310 and 31452354704 both ended at
    # 55m36s, and the second one was a single shard over all 230 tribunales. 350 leaves a margin
    # under the 360-minute ceiling for the ingest and artifact steps to finish.
    timeout-minutes: 350
    strategy:
      fail-fast: false          # one shard blocked must not cancel the others
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install playwright psycopg2-binary requests \
                      google-auth google-auth-oauthlib google-api-python-client
          playwright install chromium --with-deps

      - name: Xvfb (headed, never headless — see header)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb >/dev/null 2>&1 || true
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Name this window's state artifact
        id: art
        run: |
          # The artifact carries the WINDOW in its name on purpose. worker_a.py refuses to resume
          # a state whose meta window differs from the one asked for — correctly, since tribunal
          # completion is recorded with no window attached — so restoring a July state into a June
          # run would abort the job. Naming them apart makes that mistake impossible.
          D=$(echo "${{ inputs.desde }}" | tr '/' '-')
          H=$(echo "${{ inputs.hasta }}" | tr '/' '-')
          echo "name=state-${D}_${H}-s${{ matrix.slot }}" >> "$GITHUB_OUTPUT"

      - name: Restore previous state (resume)
        if: ${{ inputs.resume == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ⚠️ WITHOUT THIS A RUNNER STARTS FROM ZERO EVERY TIME. needs_visit() reads only the
          # local state.json, so a fresh runner re-opens every causa it already harvested — and a
          # causa open is the scarcest thing we spend. The workflow was already uploading state as
          # an artifact and never reading one back, so each dispatch redid the same first courts.
          NAME="${{ steps.art.outputs.name }}"
          mkdir -p felipe/pjud/data/worker_a${{ matrix.slot }}
          for id in $(gh run list --workflow=pjud-censo.yml -R "$GITHUB_REPOSITORY" \
                        --limit 40 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$NAME" -D /tmp/prev 2>/dev/null; then
              if [ -f /tmp/prev/state.json ]; then
                cp /tmp/prev/state.json felipe/pjud/data/worker_a${{ matrix.slot }}/state.json
                # jq, not an inline python heredoc: unindented python lines terminate the YAML
                # block scalar and the whole workflow stops parsing.
                DONE=$(jq '[.tribunales[] | select(.complete)] | length' /tmp/prev/state.json)
                ALL=$(jq '.tribunales | length' /tmp/prev/state.json)
                CAU=$(jq '.causas | length' /tmp/prev/state.json)
                WIN=$(jq -r '.meta.desde + " .. " + .meta.hasta' /tmp/prev/state.json)
                echo "resumed from run $id — $DONE/$ALL tribunales complete, $CAU causas banked"
                echo "state window: $WIN  (this run asks for ${{ inputs.desde }} .. ${{ inputs.hasta }})"
                exit 0
              fi
            fi
          done
          echo "no previous '$NAME' artifact found — starting this window from scratch"

      - name: Restore config (Neon + Drive ids)
        working-directory: felipe/pjud/scraper
        env:
          PJUD_CONFIG: ${{ secrets.PJUD_CONFIG }}
        run: |
          printf '%s' "$PJUD_CONFIG" > pjud_config.json
          python -c "import json;d=json.load(open('pjud_config.json'));print('config keys:',sorted(d))"

      - name: Google credentials (only needed when detail=true)
        if: ${{ inputs.detail == 'true' }}
        working-directory: felipe/pjud/scraper
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_JSON:    ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_CLIENT_SECRET" > client_secret.json
          printf '%s' "$GOOGLE_TOKEN_JSON"    > token.json

      - name: Ramp + identify this runner
        run: |
          # ⚠️ DO NOT let the shards arrive together. Six launched simultaneously and only ONE
          # got in; the other five never reached the OJV at all. The same thing happens locally
          # when two fresh browsers load pjud.cl in the same second — a burst of brand-new
          # sessions is itself the trigger, independently of request rate. So each shard waits
          # its turn before it so much as opens Chrome.
          #
          # ⚠️ THIS IS NOW A RAMP, NOT A STAGGER, and the difference is the point. 180 s was only
          # ever enough to keep two walk-ins from overlapping; it told us nothing about whether
          # the ADDRESS RANGE tolerates a second worker, because by the time shard 2 was warm
          # shard 1 had barely started. `ramp_min` (default 30 min) lets each runner prove itself
          # for a real stretch before the next one joins, so a failure can be attributed to the
          # worker that caused it. Set ramp_min=0 to go back to the old all-at-once behaviour.
          #
          # Actions minutes are free on a public repo, so a runner waiting its turn costs nothing
          # but wall clock — and the job ceiling is 350 min, which bounds how far this can ramp:
          # shard N idles N-1 ramps before it starts, so keep shards * ramp_min well under that.
          WAIT=$(( (${{ matrix.slot }} - 1) * ${{ inputs.ramp_min }} * 60 ))
          if [ "$WAIT" -gt 0 ]; then
            echo "shard ${{ matrix.slot }}: holding ${WAIT}s (${{ inputs.ramp_min }} min x $(( ${{ matrix.slot }} - 1 ))) so the runner before me can prove itself first"
          fi
          sleep "$WAIT"
          echo "runner public IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"

      # ⚠️ THE WORKER OPENS ITS OWN CHROME NOW — this step used to launch it here, and that is
      # why a wedged runner could not save itself. fresh_browser() is the only thing that fixes a
      # form whose tribunal select has stopped working (measured 4x on 2026-08-12, local), and it
      # refuses to close a browser the worker did not open. So a shell-launched Chrome left every
      # runner without the one repair it needs most — on the one machine nobody can reach by hand.
      # launch_chrome() carries the same flags this step did, --no-sandbox included, and picks
      # Playwright's chromium when no Chrome is installed.
      - name: Censo shard ${{ matrix.slot }} (tribunales ${{ matrix.start }}-${{ matrix.end }})
        working-directory: felipe/pjud/scraper
        run: |
          # ⚠️ --max-recover 1 HERE, against the default of 6. The recovery ladder assumes a
          # block that clears — which is what happens locally, where it worked 14 times out of 14
          # on 2026-08-11. On a runner it does not clear. Run 31501974530 spent SEVENTY MINUTES
          # on six recoveries: each one re-entered cleanly (tab closed, walked back in from
          # www.pjud.cl, form rebuilt, 230 tribunales loaded) and each one was refused again
          # within ~80 s. The session was never the problem — the ADDRESS is flagged, and no
          # amount of re-entry changes a runner's IP.
          # So take one cheap retry for a genuine hiccup, then stop and let the job end: the
          # ingest and the state artifact still run, and the real reset is the NEXT dispatch,
          # which lands on a different runner with a different IP.
          # ⚠️ SCALE THE PACING BY THE SHARD COUNT. This is the rate rule, translated for runners.
          # Locally, adding a worker slows every other one down — they share one connection and
          # one machine, so four workers measured 1.75 result requests/min on 2026-08-12, about
          # what a single worker produces. THAT SELF-DAMPING DOES NOT EXIST HERE. Each runner has
          # its own machine and its own link, so N shards at the same gap really is N times the
          # rate — into a budget that belongs to the whole datacenter RANGE, not to one address.
          #
          # That is very likely what killed the 3-shard run on 2026-08-11: three shards at a 20 s
          # gap is ~9 result requests/min, five times anything measured safe, and all three took
          # their first block within FOURTEEN SECONDS of each other. It was read as "the range is
          # flagged, sharding is pointless". Maybe — but it was never tested at a sane aggregate.
          #
          # gap x N holds the TOTAL where one worker sits: N shards each firing every base*N
          # seconds is N/(base*N) = 1/base requests per second, whatever N is. So the aggregate
          # is identical at 1, 2 or 6 shards, and this test measures what it means to measure:
          # whether the range objects to CONCURRENT SESSIONS at all, with rate held constant.
          N=${{ inputs.shards }}
          SG=$(python -c "print(round(${{ inputs.base_search_gap }} * $N, 1))")
          CG=$(python -c "print(round(${{ inputs.base_causa_gap }}  * $N, 1))")
          echo "shards=$N -> search gap ${SG}s, causa gap ${CG}s per runner (aggregate = 1 worker)"
          ARGS=(--max-recover 1 --launch-chrome --search-gap "$SG" --causa-gap "$CG")
          if [ "${{ inputs.detail }}" != "true" ]; then ARGS+=(--no-detail); fi
          if [ -n "${{ inputs.only_proc }}" ]; then ARGS+=(--only-proc "${{ inputs.only_proc }}"); fi
          python -u worker_a.py --port 9222 --slot ${{ matrix.slot }} \
            --chrome-profile "$HOME/pjud_p${{ matrix.slot }}" \
            --start ${{ matrix.start }} --end ${{ matrix.end }} \
            --desde "${{ inputs.desde }}" --hasta "${{ inputs.hasta }}" "${ARGS[@]}"

      - name: Ingest to Neon
        if: always()
        working-directory: felipe/pjud/scraper
        run: |
          # ⚠️ --slot IS NOT OPTIONAL. Without it ingest defaults to slot 0 and reads
          # data/worker_a/state.json, while the worker wrote data/worker_a<slot>/state.json — so
          # it exits with "could not read a consistent state.json" having ingested nothing. That
          # is not theoretical: run 31501974530 harvested 226 causas, 211 ebooks and 431 MB of
          # PDFs over four and a half hours and wrote NONE of it to Neon or Drive, because of
          # this one missing flag. The local supervisor always passed it; this step never did.
          # ⚠️ AND DO NOT SWALLOW THE FAILURE. `|| echo` made the step green, so the run looked
          # like it had ingested when it had not. A failed ingest must be loud — the PDFs live
          # only on the runner and die with it.
          # --shells matters for a census run: it discovers causas without opening them, so
          # without this the whole shard would write nothing at all.
          UP=""
          if [ "${{ inputs.detail }}" != "true" ]; then UP="--no-upload"; fi
          python -u ingest_worker_a.py --slot ${{ matrix.slot }} --shells $UP

      - name: Summary
        if: always()
        working-directory: felipe/pjud/scraper
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          f = pathlib.Path("../data/worker_a${{ matrix.slot }}/state.json")
          print(f"### shard ${{ matrix.slot }} — tribunales ${{ matrix.start }}-${{ matrix.end }}\n")
          if f.exists():
              st = json.loads(f.read_text(encoding="utf-8"))
              t = st["tribunales"]
              print(f"- tribunales barridos: **{len(t)}**")
              print(f"- causas de banco: **{sum(v['banks'] for v in t.values())}**")
              print(f"- incompletos: {[v['name'] for v in t.values() if not v.get('complete')] or 'ninguno'}")
          else:
              print("- sin estado (el shard no llegó a barrer)")
          PY

      # ⚠️ STATE GOES IN AN ARTIFACT OF ITS OWN, one file, nothing else. upload-artifact strips the
      # common ancestor of the paths it is given, so bundling chrome.err with it moved state.json
      # down to data/worker_aN/state.json inside the zip — and the restore step above, which looks
      # for state.json at the root, would silently find nothing and start from zero every time.
      # Uploaded on `always()` so a job killed by the timeout still hands its progress to the next
      # dispatch; that path is proven — run 31452354704 finalized its artifact after being killed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.art.outputs.name }}
          path: felipe/pjud/data/worker_a${{ matrix.slot }}/state.json
          if-no-files-found: warn

      # ⚠️ Chrome's stderr moved when the worker took over the launch: launch_chrome() writes it
      # beside the profile dir as chrome_<port>.err, i.e. $HOME, not the workspace. Collect it
      # explicitly — upload-artifact does not expand ~, and pointing at the old path would leave
      # every runner failure undiagnosable while looking like it was being captured.
      - name: Collect Chrome stderr
        if: always()
        run: cp "$HOME/chrome_9222.err" felipe/pjud/scraper/chrome.err 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-s${{ matrix.slot }}-${{ github.run_attempt }}
          path: felipe/pjud/scraper/chrome.err
          if-no-files-found: ignore

  # ── Continue on a fresh runner ────────────────────────────────────────────────
  # A blocked runner cannot be rescued from inside: run 31501974530 re-entered cleanly six times
  # over seventy minutes and was refused within ~80 s every time, because the IP is what carries
  # the verdict. The only real reset is a different machine. So when a sweep stops short, this
  # hands the baton on — same window, resume=true, one fewer hop allowed.
  #
  # ⚠️ IT IS A SEPARATE JOB, NOT A STEP IN `censo`, AND THAT IS THE WHOLE POINT. `censo` is a
  # MATRIX: with three shards, a per-shard dispatch would fire three continuations, each of three
  # shards — nine runs, then twenty-seven. `needs: censo` runs this exactly once, after every
  # shard has finished, so the baton is passed by one hand.
  #
  # The stop conditions, all of which must hold to continue:
  #   * !cancelled()  — you cancelled the run, so cancelling means STOP. (It also means a job
  #     killed by timeout-minutes does not chain; re-dispatch by hand for that. Stopping when
  #     unsure beats a loop nobody asked for.)
  #   * censo did not succeed — success means every shard reached DONE and there is nothing left.
  #   * chain > 0 — a hard, decrementing bound. Even a run that achieves nothing at all can only
  #     repeat `chain` times, so no progress check can turn into an infinite loop.
  chain:
    needs: censo
    if: ${{ !cancelled() && needs.censo.result != 'success' && inputs.chain != '0' && inputs.chain != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Hand over to a fresh runner
        env:
          # GITHUB_TOKEN deliberately cannot trigger workflow_dispatch — that is GitHub's own
          # loop guard — so the chain needs a real PAT.
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          set -euo pipefail
          LEFT=$(( ${{ inputs.chain }} - 1 ))
          echo "censo finished as '${{ needs.censo.result }}' — work remains, ${LEFT} hop(s) left after this"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DISPATCH_PAT is empty — cannot hand over. Re-dispatch by hand."
            exit 1
          fi
          # ⚠️ WAIT BEFORE HANDING OVER. "A fresh runner means a fresh IP" is true and useless:
          # the new IP lives in the SAME datacenter range, and the range is what carries the
          # verdict. Measured 2026-08-11 on run 31535761823 — three shards on 128.24.160.226,
          # 132.196.32.71 and 48.217.108.208 all took their first block within FOURTEEN SECONDS
          # of each other (22:07:04 / :17 / :18), while the residential workers sweeping through
          # that same minute saw nothing at all. Three machines also produced what one produces:
          # 214 causa opens against 226 for a single shard alone.
          # So handing over immediately just burns a hop against a range that is still hot. The
          # single-shard block at 19:07 and a clean start at 21:00 put the recovery near two
          # hours; 100 minutes is the default and it is an input, because one measurement is not
          # a curve. Actions minutes are free on a public repo, so the wait costs nothing but time.
          COOL=$(( ${{ inputs.cooloff_min }} * 60 ))
          if [ "$COOL" -gt 0 ]; then
            echo "waiting ${{ inputs.cooloff_min }} min for the address range to cool before handing over"
            sleep "$COOL"
          fi
          gh workflow run pjud-censo.yml -R "$GITHUB_REPOSITORY" --ref main \
            -f desde="${{ inputs.desde }}" \
            -f hasta="${{ inputs.hasta }}" \
            -f shards="${{ inputs.shards }}" \
            -f detail="${{ inputs.detail }}" \
            -f only_proc="${{ inputs.only_proc }}" \
            -f resume="true" \
            -f chain="$LEFT" \
            -f cooloff_min="${{ inputs.cooloff_min }}"
          echo "handed over — the new run resumes from this window's state artifact on a new IP"
          {
            echo "### Relanzado automáticamente"
            echo ""
            echo "- censo terminó como \`${{ needs.censo.result }}\`"
            echo "- quedan **${LEFT}** relanzamientos"
            echo "- la nueva corrida continúa desde el artefacto de esta ventana, en otra IP"
          } >> "$GITHUB_STEP_SUMMARY"
