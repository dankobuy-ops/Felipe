name: PJUD — censo remoto (por demanda)

# Sharded national census across N runners, on demand. Each shard takes a disjoint slice of the
# ~230 civil tribunales, sweeps it, and writes what it finds straight to Neon.
#
# ON DEMAND ONLY, deliberately. The previous PJUD workflow carried a cron and spent ~13 days
# firing 17 failing jobs a day at the OJV. If this is ever wanted on a schedule, that is a
# decision to take explicitly, after it has proven itself by hand.
#
# ⚠️ HEADED UNDER XVFB, NEVER HEADLESS. Measured 2026-08-11, same code both ways:
#     headed under Xvfb   entered, 232 tribunales, search returned results
#     --headless=new      entry failed after 102 s, form never appeared
# F5's challenge script tests document.visibilityState, and a headless browser has no visible
# surface, so the challenge never completes. That single flag is the entire reason the old
# workflow failed every day for a fortnight. `headless_check.py` re-verifies it in one command.
#
# Each runner gets its own IP, so shards do not share a rate budget the way local workers do.
#
# A census alone is ~3.3 h for 230 tribunales on one worker; WITH detail (open every bank causa
# and fetch its ebook) it is far longer — locally that runs at roughly one causa a minute. So a
# detail pass is not expected to finish in one dispatch, and does not need to: state is carried
# forward in an artifact keyed to the date window, and re-dispatching resumes where the last run
# stopped. Completed tribunales are skipped instantly and causas already banked are never
# re-opened, so the second dispatch spends its budget only on what is actually left.

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Desde (dd/mm/aaaa)"
        required: true
        default: "01/07/2026"
      hasta:
        description: "Hasta (dd/mm/aaaa)"
        required: true
        default: "14/07/2026"
      shards:
        description: "Cuántos runners en paralelo (1 = un solo worker de punta a punta)"
        required: false
        default: "1"
      detail:
        description: "false = solo censo | true = además abre cada causa y baja el ebook"
        required: false
        default: "true"
      only_proc:
        description: "Regex de procedimiento a conservar (vacío = todos)"
        required: false
        default: "obligaci.*dar"
      resume:
        description: "true = continuar el state de la corrida anterior de esta MISMA ventana"
        required: false
        default: "true"

permissions:
  contents: read
  actions: read            # required to pull the previous run's state artifact

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math, os
          n = max(1, min(12, int("${{ inputs.shards }}" or 6)))
          total = 230
          step = math.ceil(total / n)
          shards = [{"slot": i + 1, "start": i * step,
                     "end": min(total - 1, (i + 1) * step - 1)}
                    for i in range(n) if i * step <= total - 1]
          print("matrix=" + json.dumps({"include": shards}))
          PY

  censo:
    needs: plan
    runs-on: ubuntu-latest
    # ⚠️ 55 was NEVER GitHub's limit — a hosted job may run for 6 hours. That number came from
    # sizing six parallel shards and was then inherited by single-shard runs, which simply died
    # at 55 min with the country half-swept: runs 31450801310 and 31452354704 both ended at
    # 55m36s, and the second one was a single shard over all 230 tribunales. 350 leaves a margin
    # under the 360-minute ceiling for the ingest and artifact steps to finish.
    timeout-minutes: 350
    strategy:
      fail-fast: false          # one shard blocked must not cancel the others
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install playwright psycopg2-binary requests \
                      google-auth google-auth-oauthlib google-api-python-client
          playwright install chromium --with-deps

      - name: Xvfb (headed, never headless — see header)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb >/dev/null 2>&1 || true
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Name this window's state artifact
        id: art
        run: |
          # The artifact carries the WINDOW in its name on purpose. worker_a.py refuses to resume
          # a state whose meta window differs from the one asked for — correctly, since tribunal
          # completion is recorded with no window attached — so restoring a July state into a June
          # run would abort the job. Naming them apart makes that mistake impossible.
          D=$(echo "${{ inputs.desde }}" | tr '/' '-')
          H=$(echo "${{ inputs.hasta }}" | tr '/' '-')
          echo "name=state-${D}_${H}-s${{ matrix.slot }}" >> "$GITHUB_OUTPUT"

      - name: Restore previous state (resume)
        if: ${{ inputs.resume == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ⚠️ WITHOUT THIS A RUNNER STARTS FROM ZERO EVERY TIME. needs_visit() reads only the
          # local state.json, so a fresh runner re-opens every causa it already harvested — and a
          # causa open is the scarcest thing we spend. The workflow was already uploading state as
          # an artifact and never reading one back, so each dispatch redid the same first courts.
          NAME="${{ steps.art.outputs.name }}"
          mkdir -p felipe/pjud/data/worker_a${{ matrix.slot }}
          for id in $(gh run list --workflow=pjud-censo.yml -R "$GITHUB_REPOSITORY" \
                        --limit 40 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$NAME" -D /tmp/prev 2>/dev/null; then
              if [ -f /tmp/prev/state.json ]; then
                cp /tmp/prev/state.json felipe/pjud/data/worker_a${{ matrix.slot }}/state.json
                # jq, not an inline python heredoc: unindented python lines terminate the YAML
                # block scalar and the whole workflow stops parsing.
                DONE=$(jq '[.tribunales[] | select(.complete)] | length' /tmp/prev/state.json)
                ALL=$(jq '.tribunales | length' /tmp/prev/state.json)
                CAU=$(jq '.causas | length' /tmp/prev/state.json)
                WIN=$(jq -r '.meta.desde + " .. " + .meta.hasta' /tmp/prev/state.json)
                echo "resumed from run $id — $DONE/$ALL tribunales complete, $CAU causas banked"
                echo "state window: $WIN  (this run asks for ${{ inputs.desde }} .. ${{ inputs.hasta }})"
                exit 0
              fi
            fi
          done
          echo "no previous '$NAME' artifact found — starting this window from scratch"

      - name: Restore config (Neon + Drive ids)
        working-directory: felipe/pjud/scraper
        env:
          PJUD_CONFIG: ${{ secrets.PJUD_CONFIG }}
        run: |
          printf '%s' "$PJUD_CONFIG" > pjud_config.json
          python -c "import json;d=json.load(open('pjud_config.json'));print('config keys:',sorted(d))"

      - name: Google credentials (only needed when detail=true)
        if: ${{ inputs.detail == 'true' }}
        working-directory: felipe/pjud/scraper
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_JSON:    ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_CLIENT_SECRET" > client_secret.json
          printf '%s' "$GOOGLE_TOKEN_JSON"    > token.json

      - name: Stagger + identify this runner
        run: |
          # ⚠️ DO NOT let the shards arrive together. Six launched simultaneously and only ONE
          # got in; the other five never reached the OJV at all. The same thing happens locally
          # when two fresh browsers load pjud.cl in the same second — a burst of brand-new
          # sessions is itself the trigger, independently of request rate. So each shard waits
          # its turn before it so much as opens Chrome.
          WAIT=$(( (${{ matrix.slot }} - 1) * 50 ))
          echo "shard ${{ matrix.slot }}: waiting ${WAIT}s so the shards do not arrive together"
          sleep "$WAIT"
          echo "runner public IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"

      - name: Launch Chrome (headed, own profile)
        working-directory: felipe/pjud/scraper
        run: |
          # --no-sandbox is mandatory in a CI container; without it Chrome dies before it ever
          # opens the debugging port, which reads as a WAF refusal and is nothing of the kind.
          CHROME=$(python -c "from playwright.sync_api import sync_playwright;\
            p=sync_playwright().start();print(p.chromium.executable_path)")
          "$CHROME" --remote-debugging-port=9222 --user-data-dir="$HOME/pjud_p${{ matrix.slot }}" \
            --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --no-first-run --no-default-browser-check --window-size=1440,900 \
            https://www.pjud.cl/ >/dev/null 2>chrome.err &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:9222/json/version | head -c 120 || (echo "CDP DOWN"; tail -20 chrome.err; exit 1)

      - name: Censo shard ${{ matrix.slot }} (tribunales ${{ matrix.start }}-${{ matrix.end }})
        working-directory: felipe/pjud/scraper
        run: |
          ARGS=()
          if [ "${{ inputs.detail }}" != "true" ]; then ARGS+=(--no-detail); fi
          if [ -n "${{ inputs.only_proc }}" ]; then ARGS+=(--only-proc "${{ inputs.only_proc }}"); fi
          python -u worker_a.py --port 9222 --slot ${{ matrix.slot }} \
            --start ${{ matrix.start }} --end ${{ matrix.end }} \
            --desde "${{ inputs.desde }}" --hasta "${{ inputs.hasta }}" "${ARGS[@]}"

      - name: Ingest to Neon
        if: always()
        working-directory: felipe/pjud/scraper
        run: |
          # ⚠️ --slot IS NOT OPTIONAL. Without it ingest defaults to slot 0 and reads
          # data/worker_a/state.json, while the worker wrote data/worker_a<slot>/state.json — so
          # it exits with "could not read a consistent state.json" having ingested nothing. That
          # is not theoretical: run 31501974530 harvested 226 causas, 211 ebooks and 431 MB of
          # PDFs over four and a half hours and wrote NONE of it to Neon or Drive, because of
          # this one missing flag. The local supervisor always passed it; this step never did.
          # ⚠️ AND DO NOT SWALLOW THE FAILURE. `|| echo` made the step green, so the run looked
          # like it had ingested when it had not. A failed ingest must be loud — the PDFs live
          # only on the runner and die with it.
          # --shells matters for a census run: it discovers causas without opening them, so
          # without this the whole shard would write nothing at all.
          UP=""
          if [ "${{ inputs.detail }}" != "true" ]; then UP="--no-upload"; fi
          python -u ingest_worker_a.py --slot ${{ matrix.slot }} --shells $UP

      - name: Summary
        if: always()
        working-directory: felipe/pjud/scraper
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          f = pathlib.Path("../data/worker_a${{ matrix.slot }}/state.json")
          print(f"### shard ${{ matrix.slot }} — tribunales ${{ matrix.start }}-${{ matrix.end }}\n")
          if f.exists():
              st = json.loads(f.read_text(encoding="utf-8"))
              t = st["tribunales"]
              print(f"- tribunales barridos: **{len(t)}**")
              print(f"- causas de banco: **{sum(v['banks'] for v in t.values())}**")
              print(f"- incompletos: {[v['name'] for v in t.values() if not v.get('complete')] or 'ninguno'}")
          else:
              print("- sin estado (el shard no llegó a barrer)")
          PY

      # ⚠️ STATE GOES IN AN ARTIFACT OF ITS OWN, one file, nothing else. upload-artifact strips the
      # common ancestor of the paths it is given, so bundling chrome.err with it moved state.json
      # down to data/worker_aN/state.json inside the zip — and the restore step above, which looks
      # for state.json at the root, would silently find nothing and start from zero every time.
      # Uploaded on `always()` so a job killed by the timeout still hands its progress to the next
      # dispatch; that path is proven — run 31452354704 finalized its artifact after being killed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.art.outputs.name }}
          path: felipe/pjud/data/worker_a${{ matrix.slot }}/state.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-s${{ matrix.slot }}-${{ github.run_attempt }}
          path: felipe/pjud/scraper/chrome.err
          if-no-files-found: ignore
