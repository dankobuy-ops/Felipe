name: Enrich Emails

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID to enrich (blank = all jobs)"
        required: false
        default: ""
      sources:
        description: "Sources to use, comma-separated (blank = all): linkedin,pjud,diario_oficial,boletin_concursal,hunter,rocketreach,lusha,facebook,instagram,genealogia"
        required: false
        default: ""
      dry_run:
        description: "Dry run — print findings without writing to Supabase"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: felipe/scraper/requirements.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('felipe/scraper/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r felipe/scraper/requirements.txt

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run email enrichment
        working-directory: ${{ github.workspace }}/felipe
        run: |
          python scraper/enrich_emails.py \
            ${{ github.event.inputs.job_id != '' && format('--job-id "{0}"', github.event.inputs.job_id) || '--all' }} \
            ${{ github.event.inputs.sources != '' && format('--sources "{0}"', github.event.inputs.sources) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
