name: Consulta PJUD

# Nationwide civil scrape of the Oficina Judicial Virtual → Google Sheet/Drive.
# Default mode = search by month (Búsqueda por Fecha). Parallelised one job PER
# CORTE (each on its own runner IP), so all cortes sweep at the same time.

on:
  schedule:
    - cron: "0 9 * * *"          # daily 09:00 UTC (~05:00 Chile)
  workflow_dispatch:
    inputs:
      mode:
        description: "month (default) | rut | auto"
        required: false
        default: "month"
      corte:
        description: "Single corte value (e.g. 10=Arica). Blank = all 17 (matrix)."
        required: false
        default: ""
      desde:
        description: "Month mode: first month YYYY-MM (blank = Jan of current year)."
        required: false
        default: ""
      hasta:
        description: "Month mode: last month YYYY-MM (blank = current month)."
        required: false
        default: ""
      max_tribunals:
        description: "Cap tribunals per corte (blank = all). For quick tests."
        required: false
        default: ""
      skip_docs:
        description: "Skip PDF download/upload (fast metadata-only)."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: pjud
  cancel-in-progress: false

jobs:
  # Build the corte matrix. No secrets here, so the matrix output is never masked.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      cortes: ${{ steps.s.outputs.cortes }}
    steps:
      - id: s
        env:
          CORTE: ${{ inputs.corte }}
        run: |
          if [ -n "$CORTE" ]; then
            echo "cortes=[\"$CORTE\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'cortes=["10","11","15","20","25","30","35","40","45","46","50","55","56","60","61","90","91"]' >> "$GITHUB_OUTPUT"
          fi
          echo "matrix: $(cat "$GITHUB_OUTPUT")"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corte: ${{ fromJson(needs.plan.outputs.cortes) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: felipe/pjud/scraper/requirements.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-pjud

      - name: Install dependencies
        run: pip install -r felipe/pjud/scraper/requirements.txt

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            fonts-freefont-ttf fonts-liberation libfontconfig1 xvfb 2>/dev/null || true

      - name: Restore config (Sheet/folder IDs + start_date)
        working-directory: ${{ github.workspace }}/felipe/pjud/scraper
        env:
          PJUD_CONFIG: ${{ secrets.PJUD_CONFIG }}
        run: printf '%s' "$PJUD_CONFIG" > pjud_config.json

      - name: Scrape corte ${{ matrix.corte }}
        working-directory: ${{ github.workspace }}/felipe/pjud/scraper
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_JSON:    ${{ secrets.GOOGLE_TOKEN_JSON }}
          MODE:  ${{ inputs.mode }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          MAXT:  ${{ inputs.max_tribunals }}
          SKIPDOCS: ${{ inputs.skip_docs }}
        run: |
          args="--mode ${MODE:-month} --corte ${{ matrix.corte }} --max-seconds 19800"
          [ -n "$DESDE" ] && args="$args --desde $DESDE"
          [ -n "$HASTA" ] && args="$args --hasta $HASTA"
          [ -n "$MAXT" ]  && args="$args --max-tribunals $MAXT"
          [ "$SKIPDOCS" = "true" ] && args="$args --skip-docs"
          echo "run.py $args"
          python run.py $args
