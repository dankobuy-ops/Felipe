name: Consulta PJUD (diaria)

# Daily nationwide civil sweep of the Poder Judicial Virtual.
# One parallel job PER BANK (matrix built from the Bancos tab of the PJUD Sheet);
# each job sweeps every corte × tribunal in Chile via "Búsqueda por Rut Persona
# Jurídica", keeping only Rol-'C' causas ingresadas on/after start_date.
# No web page — results land in the Google Sheet + Drive.

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC ≈ 05:00 hora de Chile, todos los días
  workflow_dispatch:
    inputs:
      since:
        description: "Override start_date (yyyy-mm-dd). Vacío = usar el ancla guardada en config."
        required: false
        default: ""
      corte:
        description: "Restringir a UNA corte (valor, ej 90=Santiago). Vacío = las 17."
        required: false
        default: ""

# Don't pile daily runs on top of each other.
concurrency:
  group: pjud-daily
  cancel-in-progress: false

jobs:
  # 1) Read the Bancos tab and emit the matrix of active banks.
  banks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Google libraries
        run: pip install google-auth google-auth-oauthlib google-api-python-client playwright
      - name: Restore config (Sheet/folder IDs + start_date)
        working-directory: ${{ github.workspace }}/felipe/pjud/scraper
        env:
          PJUD_CONFIG: ${{ secrets.PJUD_CONFIG }}
        run: printf '%s' "$PJUD_CONFIG" > pjud_config.json
      - name: List active banks → matrix
        id: list
        working-directory: ${{ github.workspace }}/felipe/pjud/scraper
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_JSON:    ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          banks=$(python run.py --list-banks 2>/dev/null | tail -1)
          echo "Bancos activos: $banks"
          echo "matrix=$banks" >> "$GITHUB_OUTPUT"

  # 2) One job per bank — sweep all cortes × tribunales.
  scrape:
    needs: banks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        bank: ${{ fromJson(needs.banks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: felipe/pjud/scraper/requirements.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-pjud

      - name: Install dependencies
        run: pip install -r felipe/pjud/scraper/requirements.txt

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            fonts-freefont-ttf fonts-liberation libfontconfig1 xvfb 2>/dev/null || true

      - name: Restore config (Sheet/folder IDs + start_date)
        working-directory: ${{ github.workspace }}/felipe/pjud/scraper
        env:
          PJUD_CONFIG: ${{ secrets.PJUD_CONFIG }}
        run: printf '%s' "$PJUD_CONFIG" > pjud_config.json
      - name: Sweep ${{ matrix.bank.nombre }}
        working-directory: ${{ github.workspace }}/felipe/pjud/scraper
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_JSON:    ${{ secrets.GOOGLE_TOKEN_JSON }}
          SINCE: ${{ inputs.since }}
          CORTE: ${{ inputs.corte }}
        run: |
          args=""
          [ -n "$SINCE" ] && args="$args --since $SINCE"
          [ -n "$CORTE" ] && args="$args --corte $CORTE"
          python run.py \
            --rut "${{ matrix.bank.rut }}" \
            --dv "${{ matrix.bank.dv }}" \
            --bank "${{ matrix.bank.nombre }}" \
            --max-seconds 6000 $args
