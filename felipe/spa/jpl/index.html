<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta JPL</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .batch-block { margin: 0; }
    #batch-run-btn { width: 100%; padding: 1rem 1rem; background: #1f883d; color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 1.05rem; cursor: pointer; }
    #batch-run-btn:disabled { background: #8c959f; cursor: default; }
    .batch-status { display: flex; align-items: center; gap: .5rem; margin-top: .9rem; font-size: .92rem; color: #24292f; }
    #batch-progress-wrap { margin-top: .6rem; height: 8px; background: #d0d7de; border-radius: 4px; overflow: hidden; }
    #batch-progress-bar { height: 100%; width: 40%; background: #1f883d; border-radius: 4px; animation: batch-indet 1.2s ease-in-out infinite; }
    @keyframes batch-indet { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    .batch-block .hint { margin: 1rem 0 0; font-size: .8rem; }
  </style>
</head>
<body>

  <!-- First-time setup (GitHub token required to start the job) -->
  <div id="screen-setup" class="screen hidden">
    <div class="card">
      <h1>Configuración inicial</h1>
      <p class="hint">Pega tu GitHub Personal Access Token con permiso <code>workflow</code>. Solo se pide una vez por dispositivo.</p>
      <form id="setup-form">
        <label>
          GitHub Personal Access Token
          <input type="password" id="pat-input" required placeholder="ghp_..." autocomplete="off" />
        </label>
        <button type="submit">Guardar y continuar</button>
      </form>
      <p id="setup-error" class="error hidden"></p>
    </div>
  </div>

  <!-- Main screen: just the batch button + progress -->
  <div id="screen-trigger" class="screen hidden">
    <div class="card">
      <h1>Consulta JPL</h1>
      <div id="batch-block" class="batch-block">
        <button id="batch-run-btn" type="button">▶️ Iniciar consulta masiva — todos los RUT (2020+)</button>
        <div id="batch-status" class="batch-status hidden">
          <div class="spinner"></div>
          <span id="batch-status-text"></span>
        </div>
        <div id="batch-progress-wrap" class="hidden"><div id="batch-progress-bar"></div></div>
        <p class="hint">
          Corre en GitHub Actions y se reanuda solo hasta terminar — no ocupa tu equipo.
          Los datos quedan en la
          <a href="https://docs.google.com/spreadsheets/d/1SqP0w1XjvMGoEpBnbXI16EuneJMhrrSJq3hvvw_Azuo/edit" target="_blank" rel="noopener">planilla</a>;
          edita los RUT en la pestaña <code>RutsConsulta</code>.
        </p>
      </div>
    </div>
  </div>

  <script src="app.js?v=37"></script>
</body>
</html>
