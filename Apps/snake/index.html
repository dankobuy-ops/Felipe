<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Snake</title>
  <style>
    /* === Variables: Modo Claro (default) === */
    :root {
      color-scheme: light dark;
      --bg:      #ffffff;
      --surface: #f6f8fa;
      --border:  #d0d7de;
      --text:    #24292f;
      --muted:   #57606a;
      --accent:  #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #0d1117;
        --surface: #161b22;
        --border:  #30363d;
        --text:    #e6edf3;
        --muted:   #8b949e;
        --accent:  #7c6af7;
      }
    }

    /* === Back link === */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      color: var(--muted);
      font-size: .85rem;
      text-decoration: none;
      padding: .4rem 0;
      transition: color .15s;
    }
    .back-link:hover { color: var(--text); }

    /* === Reset & Tipografía === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .app-header { margin-bottom: 1rem; }
    .app-header h1 { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 0.5rem; }
    .app-header p { color: var(--muted); font-size: 1.1rem; }

    .card, .input-group, fieldset {
      background-color: var(--surface);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 8px;
      padding: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      .card, .input-group, fieldset { border-color: rgba(255, 255, 255, 0.1); }
    }

    button, .btn {
      display: inline-flex; align-items: center; justify-content: center;
      background-color: var(--accent); color: #ffffff; font-weight: 600;
      padding: 0.75rem 1.5rem; border-radius: 6px; border: none;
      cursor: pointer; transition: filter 0.15s;
    }
    button:hover, .btn:hover { filter: brightness(1.1); }
    button:disabled, .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }

    /* === App-specific: Snake (game layout override) === */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      gap: 1rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 420px;
    }

    h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: .05em; color: #4ade80; }

    .score-bar {
      display: flex; gap: 16px;
      width: 100%; max-width: 420px;
    }

    .score-box {
      flex: 1; background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px; text-align: center;
    }
    .score-box .label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .score-box .value { font-size: 1.5rem; font-weight: 800; color: #4ade80; }
    .score-box.best .value { color: #fbbf24; }

    canvas {
      border-radius: 16px;
      display: block;
      image-rendering: pixelated;
      touch-action: none;
      border: 1px solid var(--border);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 52px);
      gap: 6px;
    }

    .ctrl-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted); font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      width: 52px; height: 52px;
      transition: background .1s, transform .1s;
      user-select: none; -webkit-user-select: none;
    }
    .ctrl-btn:active { background: var(--border); transform: scale(.93); }
    .ctrl-up    { grid-column: 2; grid-row: 1; }
    .ctrl-left  { grid-column: 1; grid-row: 2; }
    .ctrl-down  { grid-column: 2; grid-row: 2; }
    .ctrl-right { grid-column: 3; grid-row: 2; }

    .overlay {
      position: absolute; inset: 0;
      border-radius: 16px;
      background: rgba(0,0,0,.8);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      backdrop-filter: blur(4px);
    }
    .overlay h2 { font-size: 1.6rem; font-weight: 800; color: #f1f5f9; }
    .overlay .sub { font-size: .9rem; color: #94a3b8; }
    .overlay .final-score { font-size: 2.2rem; font-weight: 800; color: #4ade80; }

    .btn-start {
      background: #4ade80; color: #0f172a; border: none;
      padding: 12px 32px; border-radius: 100px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn-start:hover { background: #86efac; }
    .btn-start:active { transform: scale(.96); }

    .canvas-wrap { position: relative; }
    .hint { font-size: .76rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <a href="../" class="back-link">← Volver al inicio</a>

  <header>
    <h1>🐍 Snake</h1>
  </header>

  <div class="score-bar">
    <div class="score-box">
      <div class="label">Puntos</div>
      <div class="value" id="scoreDisplay">0</div>
    </div>
    <div class="score-box best">
      <div class="label">Récord</div>
      <div class="value" id="bestDisplay">0</div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div class="overlay" id="overlay">
      <h2>🐍 Snake</h2>
      <p class="sub">Usa las flechas, WASD o los botones</p>
      <button class="btn-start" id="startBtn">Jugar</button>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn ctrl-up"    data-dir="UP">▲</button>
    <button class="ctrl-btn ctrl-left"  data-dir="LEFT">◀</button>
    <button class="ctrl-btn ctrl-down"  data-dir="DOWN">▼</button>
    <button class="ctrl-btn ctrl-right" data-dir="RIGHT">▶</button>
  </div>

  <p class="hint">Teclado: flechas o WASD · Móvil: desliza o usa los botones</p>

<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

const CELL  = 20;
const COLS  = 20;
const ROWS  = 20;
const SIZE  = CELL * COLS;

canvas.width  = SIZE;
canvas.height = SIZE;
canvas.style.width  = Math.min(SIZE, window.innerWidth - 32) + 'px';
canvas.style.height = Math.min(SIZE, window.innerWidth - 32) + 'px';

const COLORS = {
  bg:       '#0f172a',
  grid:     '#1e293b',
  head:     '#4ade80',
  body:     '#22c55e',
  tail:     '#16a34a',
  food:     '#f87171',
  foodGlow: 'rgba(248,113,113,.35)',
};

const DIR = { UP:[0,-1], DOWN:[0,1], LEFT:[-1,0], RIGHT:[1,0] };
const OPPOSITE = { UP:'DOWN', DOWN:'UP', LEFT:'RIGHT', RIGHT:'LEFT' };

let snake, dir, nextDir, food, score, best, running, animId, speed;

best = parseInt(localStorage.getItem('snake_best') || '0');
document.getElementById('bestDisplay').textContent = best;

function initGame() {
  const mid = Math.floor(COLS / 2);
  snake   = [{x:mid, y:mid}, {x:mid-1, y:mid}, {x:mid-2, y:mid}];
  dir     = 'RIGHT';
  nextDir = 'RIGHT';
  score   = 0;
  speed   = 150;
  spawnFood();
  updateScore(0);
}

function spawnFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  let pos;
  do { pos = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) }; }
  while (occupied.has(`${pos.x},${pos.y}`));
  food = pos;
}

function updateScore(n) {
  score = n;
  document.getElementById('scoreDisplay').textContent = score;
  if (score > best) {
    best = score;
    localStorage.setItem('snake_best', best);
    document.getElementById('bestDisplay').textContent = best;
  }
}

let lastTime = 0;
function gameLoop(ts) {
  animId = requestAnimationFrame(gameLoop);
  if (ts - lastTime < speed) return;
  lastTime = ts;

  dir = nextDir;
  const head = snake[0];
  const [dx, dy] = DIR[dir];
  const newHead = { x: head.x + dx, y: head.y + dy };

  if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) return gameOver();
  if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) return gameOver();

  snake.unshift(newHead);
  if (newHead.x === food.x && newHead.y === food.y) {
    updateScore(score + 10);
    spawnFood();
    if (score % 50 === 0 && speed > 70) speed -= 10;
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, SIZE, SIZE);

  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = .5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, SIZE); ctx.stroke();
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.beginPath(); ctx.moveTo(0, j*CELL); ctx.lineTo(SIZE, j*CELL); ctx.stroke();
  }

  ctx.fillStyle = COLORS.foodGlow;
  ctx.beginPath();
  ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = COLORS.food;
  roundRect(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4, 5);

  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? COLORS.head : i === snake.length-1 ? COLORS.tail : COLORS.body;
    const pad = i === 0 ? 1 : 2;
    roundRect(seg.x*CELL+pad, seg.y*CELL+pad, CELL-pad*2, CELL-pad*2, i === 0 ? 6 : 4);
  });

  const h = snake[0];
  const [edx, edy] = DIR[dir];
  ctx.fillStyle = '#0f172a';
  const ex = h.x*CELL + CELL/2 + edx*4;
  const ey = h.y*CELL + CELL/2 + edy*4;
  ctx.beginPath(); ctx.arc(ex + (edy !== 0 ? 3 : 0), ey + (edx !== 0 ? 3 : 0), 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex - (edy !== 0 ? 3 : 0), ey - (edx !== 0 ? 3 : 0), 2.5, 0, Math.PI*2); ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath(); ctx.fill();
}

function gameOver() {
  cancelAnimationFrame(animId);
  running = false;
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `
    <h2 style="color:#f87171">Game Over</h2>
    <p class="sub">Puntuación final</p>
    <div class="final-score">${score}</div>
    ${score >= best && score > 0 ? '<p style="color:#fbbf24;font-weight:700">🏆 ¡Nuevo récord!</p>' : ''}
    <button class="btn-start" id="startBtn">Jugar de nuevo</button>
  `;
  overlay.style.display = 'flex';
  document.getElementById('startBtn').addEventListener('click', startGame);
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  initGame();
  running = true;
  lastTime = 0;
  cancelAnimationFrame(animId);
  animId = requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', e => {
  const map = { ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT', w:'UP', s:'DOWN', a:'LEFT', d:'RIGHT', W:'UP', S:'DOWN', A:'LEFT', D:'RIGHT' };
  const d = map[e.key];
  if (d) { e.preventDefault(); if (!running) { startGame(); return; } if (d !== OPPOSITE[dir]) nextDir = d; }
  if (e.key === ' ' && !running) startGame();
});

document.querySelectorAll('.ctrl-btn').forEach(btn => {
  ['touchstart','mousedown'].forEach(ev => {
    btn.addEventListener(ev, e => {
      e.preventDefault();
      const d = btn.dataset.dir;
      if (!running) { startGame(); return; }
      if (d !== OPPOSITE[dir]) nextDir = d;
    }, { passive: false });
  });
});

let tx = 0, ty = 0;
canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
  let d;
  if (Math.abs(dx) > Math.abs(dy)) d = dx > 0 ? 'RIGHT' : 'LEFT';
  else d = dy > 0 ? 'DOWN' : 'UP';
  if (!running) { startGame(); return; }
  if (d !== OPPOSITE[dir]) nextDir = d;
}, { passive: true });

initGame();
draw();
</script>
</body>
</html>
