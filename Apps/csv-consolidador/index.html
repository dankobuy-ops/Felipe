<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Fusiona múltiples archivos CSV en uno solo con columna de origen automática. 100% local.">
  <title>CSV Consolidador</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="../" class="back-link">← Volver al inicio</a>

    <header class="app-header">
      <h1>⚡ CSV Consolidador</h1>
      <p>Unifica múltiples archivos CSV por lotes — 100% local, sin enviar datos a ningún servidor</p>
    </header>

    <main class="app-main">

      <div class="card">
        <label class="field-label" for="schema-name">Nombre del esquema</label>
        <input type="text" id="schema-name"
          placeholder="ej: gestion, contabilidad, ventas_2025"
          autocomplete="off" spellcheck="false">
        <p class="field-hint">Prefijo del archivo: <code id="preview-name">esquema_consolidado.csv</code></p>
      </div>

      <div class="card">
        <label class="field-label">Archivos CSV</label>
        <div class="drop-zone" id="drop-zone" tabindex="0" role="button"
          aria-label="Zona de arrastrar y soltar archivos CSV">
          <span class="drop-zone__icon">📂</span>
          <p class="drop-zone__text">Arrastra archivos <strong>CSV</strong> aquí</p>
          <p class="drop-zone__sub">o haz clic para seleccionarlos</p>
          <input type="file" id="file-input" accept=".csv" multiple hidden>
        </div>
        <ul class="file-list" id="file-list" hidden></ul>
      </div>

      <div class="actions">
        <button class="btn-ghost" id="clear-btn" disabled>✕ Limpiar</button>
        <button id="process-btn" disabled>⬇ Consolidar y descargar</button>
      </div>

      <div class="log-card" id="log-card" hidden>
        <div class="log-header">
          <span id="log-status-icon">🔄</span>
          <strong id="log-title">Procesando…</strong>
        </div>
        <ul class="log-list" id="log-list"></ul>
        <div class="log-footer" id="log-footer" hidden>
          <span id="log-summary"></span>
        </div>
      </div>

    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
